  <circle cx="180" cy="200" r="28" fill="url(#grad-purple)" opacity="0.15" stroke="url(#grad-purple)" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="180" cy="200" r="10" fill="url(#grad-purple)" opacity="0.35"/>
  <circle cx="180" cy="200" r="3" fill="white" opacity="0.6"/>

  <circle cx="130" cy="75" r="4" fill="url(#grad-teal)" opacity="0.2"/>
