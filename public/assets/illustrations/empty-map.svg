<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" fill="none">
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#9B8BFF"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>

    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Folded map -->

  <g filter="url(#shadow)">
    <path
      d="
      M90 230
      L125 90
      L200 70
      L270 105
      L335 80
      L315 225
      L245 245
      L180 210
      Z"
      fill="#171B2E"
      stroke="url(#purple)"
      stroke-width="2"
      stroke-linejoin="round"/>

    <!-- Fold lines -->
    <path d="M150 84 L165 216" stroke="#2D3558" stroke-width="1.5"/>
    <path d="M245 98 L225 238" stroke="#2D3558" stroke-width="1.5"/>
  </g>

  <!-- Route -->

  <path
    d="
    M140 175
    C165 145 190 150 215 130
    S265 120 285 165"
    stroke="url(#cyan)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="7 7"/>

  <!-- Start -->

  <circle
    cx="140"
    cy="175"
    r="9"
    fill="#0F172A"
    stroke="url(#emerald)"
    stroke-width="3"/>

  <!-- Middle -->

  <circle
    cx="215"
    cy="130"
    r="6"
    fill="url(#purple)"/>

  <!-- Destination -->

  <g>
    <path
      d="
      M285 152
      C293 152 299 158 299 166
      C299 179 285 193 285 193
      C285 193 271 179 271 166
      C271 158 277 152 285 152Z"
      fill="url(#purple)"/>

    <circle
      cx="285"
      cy="166"
      r="4"
      fill="white"/>
  </g>

  <!-- Tiny compass -->

  <g transform="translate(315 48)">
    <circle
      cx="20"
      cy="20"
      r="18"
      stroke="url(#cyan)"
      stroke-width="2"/>

    <path
      d="M20 8 L24 20 L20 32 L16 20Z"
      fill="url(#purple)"/>
  </g>

  <!-- Decorative sparkles -->

  <circle cx="80" cy="70" r="3" fill="#22D3EE" opacity=".35"/>
  <circle cx="355" cy="245" r="4" fill="#10B981" opacity=".25"/>
  <circle cx="60" cy="255" r="5" fill="#7C5CFF" opacity=".18"/>
  <circle cx="350" cy="95" r="3" fill="#22D3EE" opacity=".25"/>
</svg>