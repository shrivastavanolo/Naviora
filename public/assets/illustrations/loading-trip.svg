<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D5EF5"/>
      <stop offset="100%" stop-color="#8B7CF8"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="150" r="55" fill="#1E2240" stroke="url(#grad-purple)" stroke-width="2"/>

  <circle cx="200" cy="150" r="45" fill="none" stroke="url(#grad-purple)" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>

  <polygon points="200,120 210,155 200,148 190,155" fill="url(#grad-teal)"/>
  <polygon points="200,180 205,160 200,165 195,160" fill="url(#grad-purple)" opacity="0.4"/>
  <line x1="200" y1="120" x2="200" y2="105" stroke="url(#grad-teal)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="200" y1="180" x2="200" y2="195" stroke="url(#grad-purple)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <circle cx="240" cy="110" r="6" fill="url(#grad-purple)" opacity="1">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="145" r="5" fill="url(#grad-teal)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="245" cy="180" r="4" fill="url(#grad-purple)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="155" cy="115" r="5" fill="url(#grad-teal)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="165" r="4" fill="url(#grad-purple)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="170" cy="240" r="3" fill="url(#grad-teal)" opacity="0.15"/>
  <circle cx="250" cy="250" r="4" fill="url(#grad-purple)" opacity="0.12"/>
</svg>
